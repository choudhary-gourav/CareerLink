name: Keep Render Backend Awake

on:
  schedule:
    # Runs every 12 minutes to prevent Render free instance sleep
    - cron: '*/12 * * * *'
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend
        run: |
          curl -s https://careerlink-3bgb.onrender.com/actuator/health
